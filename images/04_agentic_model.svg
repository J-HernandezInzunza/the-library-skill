<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Glow filters -->
    <filter id="gGreen" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.22" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gAmber" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gCore" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#6366F1" flood-opacity="0.22" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrowhead for access -> core flow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B" fill-opacity="0.7"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- ============================================================ -->
  <!-- TITLE                                                         -->
  <!-- ============================================================ -->
  <text x="400" y="46" font-size="27" font-weight="700" fill="#E0E0E0" text-anchor="middle" opacity="0">
    The Agentic Stack
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="400" y="72" font-size="14" fill="#9CA3AF" text-anchor="middle" opacity="0">
    One engine · many doors · shared everywhere
    <animate attributeName="opacity" from="0" to="0.85" dur="0.6s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- ============================================================ -->
  <!-- DISTRIBUTION WRAPPER: The Library (green frame)              -->
  <!-- ============================================================ -->
  <g filter="url(#gGreen)">
    <rect x="60" y="120" width="680" height="448" rx="18"
          fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="2" stroke-opacity="0.55"
          stroke-dasharray="2 0" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.8s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.05;0.08;0.05" dur="6s" begin="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Library tag straddling the top border -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <rect x="250" y="106" width="300" height="30" rx="15" fill="#0B0F14" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="285" cy="121" r="4" fill="#10B981"/>
    <text x="305" y="125" font-size="13" font-weight="700" fill="#34D399" text-anchor="start">THE LIBRARY</text>
    <text x="412" y="125" font-size="12" fill="#9CA3AF" text-anchor="start">· distribution</text>
  </g>
  <text x="724" y="556" font-size="11" fill="#10B981" fill-opacity="0.7" text-anchor="end" opacity="0">
    across devices · teams · agents
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- ============================================================ -->
  <!-- ACCESS: three interchangeable doors (amber, peers)          -->
  <!-- ============================================================ -->
  <text x="400" y="166" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle" opacity="0" letter-spacing="1">
    ACCESS — interchangeable doors into the engine
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
  </text>

  <!-- Door 1: Agent chat -->
  <g filter="url(#gAmber)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
    <rect x="100" y="182" width="180" height="62" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="190" y="208" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">Agent chat</text>
    <text x="190" y="227" font-size="12" fill="#9CA3AF" text-anchor="middle">natural language</text>
  </g>
  <!-- Door 2: Justfile / CLI -->
  <g filter="url(#gAmber)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
    <rect x="310" y="182" width="180" height="62" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="400" y="208" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">Justfile / CLI</text>
    <text x="400" y="227" font-size="12" fill="#9CA3AF" text-anchor="middle">terminal</text>
  </g>
  <!-- Door 3: CI / hooks -->
  <g filter="url(#gAmber)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <rect x="520" y="182" width="180" height="62" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="610" y="208" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">CI / hooks</text>
    <text x="610" y="227" font-size="12" fill="#9CA3AF" text-anchor="middle">automated</text>
  </g>

  <!-- Converging flow arrows: doors -> core -->
  <g stroke="#F59E0B" stroke-width="1.6" stroke-opacity="0.55" fill="none" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.2s" fill="freeze"/>
    <path d="M190,244 C190,290 330,300 372,332" marker-end="url(#arrow)"/>
    <path d="M400,244 L400,330" marker-end="url(#arrow)"/>
    <path d="M610,244 C610,290 470,300 428,332" marker-end="url(#arrow)"/>
  </g>

  <!-- ============================================================ -->
  <!-- COMPOSITION: the real stack (indigo -> purple -> cyan)       -->
  <!-- ============================================================ -->
  <text x="400" y="324" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle" opacity="0" letter-spacing="1">
    COMPOSITION — what the agent can do
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.6s" fill="freeze"/>
  </text>

  <g filter="url(#gCore)">
    <!-- Passive float on the whole core -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-2;0,2;0,0" keyTimes="0;0.33;0.66;1" dur="7s" begin="6s" repeatCount="indefinite"/>

    <!-- Prompts (top) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.4s" fill="freeze"/>
      <rect x="250" y="338" width="300" height="52" rx="11" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="400" y="361" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">Prompts</text>
      <text x="400" y="379" font-size="11.5" fill="#9CA3AF" text-anchor="middle">orchestration</text>
    </g>
    <!-- Agents (mid) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.2s" fill="freeze"/>
      <rect x="250" y="398" width="300" height="52" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="400" y="421" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">Agents</text>
      <text x="400" y="439" font-size="11.5" fill="#9CA3AF" text-anchor="middle">scale + parallelism</text>
    </g>
    <!-- Skills (bottom) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.0s" fill="freeze"/>
      <rect x="250" y="458" width="300" height="52" rx="11" fill="#6366F1" fill-opacity="0.16" stroke="#6366F1" stroke-width="2"/>
      <text x="400" y="481" font-size="15" font-weight="700" fill="#E0E0E0" text-anchor="middle">Skills</text>
      <text x="400" y="499" font-size="11.5" fill="#9CA3AF" text-anchor="middle">capability</text>
    </g>
  </g>

  <!-- "builds on" upward arrow beside the stack -->
  <g stroke="#A5B4FC" stroke-width="1.4" stroke-opacity="0.45" fill="none" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="4.8s" fill="freeze"/>
    <line x1="225" y1="500" x2="225" y2="352"/>
    <polygon points="225,344 220,356 230,356" fill="#A5B4FC" fill-opacity="0.55" stroke="none"/>
  </g>
  <text x="208" y="430" font-size="11" fill="#A5B4FC" fill-opacity="0.7" text-anchor="middle" transform="rotate(-90 208 430)" opacity="0">
    each builds on the one below
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5.0s" fill="freeze"/>
  </text>

  <!-- ============================================================ -->
  <!-- LEGEND CAPTION                                                -->
  <!-- ============================================================ -->
  <text x="400" y="592" font-size="12.5" fill="#9CA3AF" text-anchor="middle" opacity="0" font-style="italic">
    Composition is hierarchical · access doors are peers · the Library delivers it all
    <animate attributeName="opacity" from="0" to="0.75" dur="0.6s" begin="5.3s" fill="freeze"/>
  </text>
</svg>
