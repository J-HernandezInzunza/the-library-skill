<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; }
    </style>

    <!-- Arrowhead markers -->
    <marker id="arrow-indigo" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#6366F1" stroke-width="1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#10B981" stroke-width="1"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#F59E0B" stroke-width="1"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glow-indigo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#6366F1" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#06B6D4" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============================================ -->
  <!-- LEFT COLUMN: Developer + Agent (0-2s)         -->
  <!-- ============================================ -->

  <!-- Developer Node -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-purple)">
      <rect x="20" y="140" width="120" height="50" rx="10"
            fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"
            stroke-dasharray="340" stroke-dashoffset="340">
        <animate attributeName="stroke-dashoffset" from="340" to="0" begin="0s" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Person icon -->
    <circle cx="52" cy="158" r="6" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <path d="M40,175 Q46,168 52,168 Q58,168 64,175" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>

    <text x="95" y="169" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="700">Developer</text>
  </g>

  <!-- /library use command pill -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <rect x="25" y="197" width="110" height="22" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="0.8"/>
    <text x="80" y="212" text-anchor="middle" class="mono" font-size="9" fill="#A5B4FC">/library use</text>
  </g>

  <!-- Agent Node -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-cyan)">
      <rect x="20" y="255" width="120" height="50" rx="10"
            fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"
            stroke-dasharray="340" stroke-dashoffset="340">
        <animate attributeName="stroke-dashoffset" from="340" to="0" begin="0.8s" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Bot icon -->
    <rect x="44" y="270" width="16" height="12" rx="3" fill="none" stroke="#06B6D4" stroke-width="1.2"/>
    <circle cx="49" cy="276" r="1.5" fill="#06B6D4"/>
    <circle cx="55" cy="276" r="1.5" fill="#06B6D4"/>
    <line x1="47" y1="268" x2="47" y2="270" stroke="#06B6D4" stroke-width="1.2"/>
    <line x1="57" y1="268" x2="57" y2="270" stroke="#06B6D4" stroke-width="1.2"/>

    <text x="95" y="284" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="700">Agent</text>
  </g>

  <!-- /library use command pill (Agent) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/>
    <rect x="25" y="312" width="110" height="22" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="0.8"/>
    <text x="80" y="327" text-anchor="middle" class="mono" font-size="9" fill="#A5B4FC">/library use</text>
  </g>

  <!-- Coworker Node -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-green)">
      <rect x="20" y="370" width="120" height="50" rx="10"
            fill="#0F172A" stroke="#10B981" stroke-width="1.5"
            stroke-dasharray="340" stroke-dashoffset="340">
        <animate attributeName="stroke-dashoffset" from="340" to="0" begin="1.2s" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Person icon -->
    <circle cx="52" cy="388" r="6" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <path d="M40,405 Q46,398 52,398 Q58,398 64,405" fill="none" stroke="#10B981" stroke-width="1.2"/>

    <text x="95" y="399" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="700">Coworker</text>
  </g>

  <!-- /library use command pill (Coworker) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
    <rect x="25" y="427" width="110" height="22" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="0.8"/>
    <text x="80" y="442" text-anchor="middle" class="mono" font-size="9" fill="#A5B4FC">/library use</text>
  </g>

  <!-- ============================================ -->
  <!-- CENTER: library.yaml (2-4s)                   -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-indigo)">
      <rect x="290" y="225" width="160" height="120" rx="10"
            fill="#0F172A" stroke="#6366F1" stroke-width="1.5"
            stroke-dasharray="560" stroke-dashoffset="560">
        <animate attributeName="stroke-dashoffset" from="560" to="0" begin="2s" dur="1.8s" fill="freeze"/>
      </rect>
    </g>

    <!-- Title -->
    <text x="370" y="250" text-anchor="middle" fill="#A5B4FC" font-size="14" font-weight="700">library.yaml</text>

    <!-- Divider line -->
    <line x1="300" y1="258" x2="440" y2="258" stroke="#374151" stroke-width="0.8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    </line>

    <!-- Entry rows inside (organized skills) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.6s" fill="freeze"/>
      <!-- Row 1 -->
      <circle cx="310" cy="275" r="3" fill="#10B981"/>
      <text x="320" y="278" class="mono" font-size="9" fill="#E0E0E0">deploy</text>
      <text x="410" y="278" class="mono" font-size="8" fill="#6B7280" text-anchor="end">github</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.6s" fill="freeze"/>
      <!-- Row 2 -->
      <circle cx="310" cy="295" r="3" fill="#F59E0B"/>
      <text x="320" y="298" class="mono" font-size="9" fill="#E0E0E0">docker</text>
      <text x="410" y="298" class="mono" font-size="8" fill="#6B7280" text-anchor="end">github</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.6s" fill="freeze"/>
      <!-- Row 3 -->
      <circle cx="310" cy="315" r="3" fill="#8B5CF6"/>
      <text x="320" y="318" class="mono" font-size="9" fill="#E0E0E0">review</text>
      <text x="420" y="318" class="mono" font-size="8" fill="#6B7280" text-anchor="end">bitbucket</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.6s" fill="freeze"/>
      <!-- Row 4 -->
      <circle cx="310" cy="335" r="3" fill="#06B6D4"/>
      <text x="320" y="338" class="mono" font-size="9" fill="#E0E0E0">diagram</text>
      <text x="420" y="338" class="mono" font-size="8" fill="#6B7280" text-anchor="end">bitbucket</text>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- RIGHT COLUMN: Sources (4-6s)                  -->
  <!-- ============================================ -->

  <!-- Private Repo -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-green)">
      <rect x="590" y="193" width="150" height="55" rx="10"
            fill="#0F172A" stroke="#10B981" stroke-width="1.5"
            stroke-dasharray="410" stroke-dashoffset="410">
        <animate attributeName="stroke-dashoffset" from="410" to="0" begin="4s" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Lock icon -->
    <rect x="605" y="216" width="10" height="8" rx="1.5" fill="none" stroke="#10B981" stroke-width="1"/>
    <path d="M607,216 V213 A3,3 0 0 1 613,213 V216" fill="none" stroke="#10B981" stroke-width="1"/>

    <text x="672" y="220" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="700">Private Repo</text>
    <text x="665" y="238" text-anchor="middle" class="mono" font-size="8" fill="#9CA3AF">org/skills (private)</text>
  </g>

  <!-- Public Repo -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.8s" fill="freeze"/>

    <g filter="url(#glow-amber)">
      <rect x="590" y="322" width="150" height="55" rx="10"
            fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"
            stroke-dasharray="410" stroke-dashoffset="410">
        <animate attributeName="stroke-dashoffset" from="410" to="0" begin="4.8s" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Globe icon -->
    <circle cx="610" cy="349" r="6" fill="none" stroke="#F59E0B" stroke-width="0.8"/>
    <ellipse cx="610" cy="349" rx="3" ry="6" fill="none" stroke="#F59E0B" stroke-width="0.6"/>
    <line x1="604" y1="349" x2="616" y2="349" stroke="#F59E0B" stroke-width="0.6"/>

    <text x="672" y="349" text-anchor="middle" fill="#E0E0E0" font-size="12" font-weight="700">Public Repo</text>
    <text x="665" y="367" text-anchor="middle" class="mono" font-size="8" fill="#9CA3AF">community/skills</text>
  </g>

  <!-- (Local Path card removed) -->

  <!-- ============================================ -->
  <!-- ARROWS: left -> center -> right (6-8s)        -->
  <!-- ============================================ -->

  <!-- Developer -> library.yaml -->
  <line x1="140" y1="165" x2="286" y2="260" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-indigo)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="180" to="0" begin="6s" dur="1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" begin="10s" repeatCount="indefinite"/>
  </line>

  <!-- Agent -> library.yaml -->
  <line x1="140" y1="280" x2="286" y2="290" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-indigo)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.3s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="180" to="0" begin="6.3s" dur="1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" begin="10s" repeatCount="indefinite"/>
  </line>

  <!-- Coworker -> library.yaml -->
  <line x1="140" y1="395" x2="286" y2="325" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-indigo)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.5s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="200" to="0" begin="6.5s" dur="1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" begin="10s" repeatCount="indefinite"/>
  </line>

  <!-- library.yaml -> Private GitHub -->
  <line x1="450" y1="270" x2="586" y2="220" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-green)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="200" to="0" begin="6.6s" dur="1.2s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" begin="10s" repeatCount="indefinite"/>
  </line>

  <!-- library.yaml -> Public GitHub -->
  <line x1="450" y1="300" x2="586" y2="350" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-amber)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.0s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="150" to="0" begin="7.0s" dur="1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" begin="10s" repeatCount="indefinite"/>
  </line>

  <!-- (Local Path arrow removed) -->

  <!-- REF labels on arrows -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.2s" dur="0.5s" fill="freeze"/>
    <rect x="497" y="237" width="36" height="16" rx="4" fill="#111827" stroke="#10B981" stroke-width="0.8"/>
    <text x="515" y="249" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#10B981">REF</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.5s" fill="freeze"/>
    <rect x="497" y="317" width="36" height="16" rx="4" fill="#111827" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="515" y="329" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#F59E0B">REF</text>
  </g>

  <!-- (Local Path REF removed) -->

  <!-- ============================================ -->
  <!-- FETCH FLOW INDICATOR (7.5-8s)                 -->
  <!-- A small animated dot traveling an arrow       -->
  <!-- ============================================ -->
  <circle cx="0" cy="0" r="3" fill="#10B981" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.3s" fill="freeze"/>
    <animateMotion begin="7.5s" dur="1.5s" fill="freeze" path="M450,262 L586,155"/>
    <animate attributeName="opacity" from="1" to="0" begin="8.8s" dur="0.3s" fill="freeze"/>
  </circle>

  <!-- ============================================ -->
  <!-- GREEN CHECKMARK + SUCCESS MESSAGE (8-9s)      -->
  <!-- ============================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.6s" fill="freeze"/>

    <!-- Checkmark circle -->
    <circle cx="400" cy="465" r="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5" filter="url(#glow-green)"/>
    <!-- Checkmark path -->
    <path d="M392,465 L398,471 L410,459" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="400" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#10B981">Organized. Private. Always current.</text>
  </g>

  <!-- ============================================ -->
  <!-- TITLE + SUBTITLE (9-10s)                      -->
  <!-- ============================================ -->

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.6s" fill="freeze"/>
    <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#E0E0E0">The Solution: The Library</text>
  </g>

  <!-- Subtitle -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9.3s" dur="0.7s" fill="freeze"/>
    <text x="400" y="525" text-anchor="middle" class="mono" font-size="12" fill="#6366F1">/library use &lt;name&gt;</text>
  </g>

  <!-- ============================================ -->
  <!-- PASSIVE PHASE (10-20s)                        -->
  <!-- Arrows flow, nodes pulse gently               -->
  <!-- ============================================ -->

  <!-- Node pulse: Developer -->
  <rect x="20" y="140" width="120" height="50" rx="10" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Node pulse: Agent -->
  <rect x="20" y="255" width="120" height="50" rx="10" fill="none" stroke="#06B6D4" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" begin="10.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Node pulse: Coworker -->
  <rect x="20" y="370" width="120" height="50" rx="10" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3.3s" begin="10.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Node pulse: library.yaml -->
  <rect x="290" y="225" width="160" height="120" rx="10" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Node pulse: Private GitHub -->
  <rect x="590" y="193" width="150" height="55" rx="10" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3.2s" begin="10.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Node pulse: Public GitHub -->
  <rect x="590" y="322" width="150" height="55" rx="10" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="2.8s" begin="11.2s" repeatCount="indefinite"/>
  </rect>

  <!-- (Local Path pulse removed) -->

  <!-- Checkmark pulse -->
  <circle cx="400" cy="465" r="18" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" begin="10s" repeatCount="indefinite"/>
    <animate attributeName="r" values="18;22;18" dur="3s" begin="10s" repeatCount="indefinite"/>
  </circle>

</svg>